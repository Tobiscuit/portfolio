<html>
  <head>
    <meta charset="utf-8" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link
      as="style"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
      onload="this.rel='stylesheet'"
      rel="stylesheet"
    />
    <title>Stitch Design</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
      :root {
        --sagescale-sage-blue-900: #1c2b3a;
        --sagescale-parchment-100: #f3efea;
        --sagescale-sage-blue-700: #3e5a74;
        --sagescale-parchment-300: #c9c1b8;
        --sagescale-amber-500: #ffc107;
        --sagescale-sage-blue-950: #101820;
      }
    </style>
  </head>
  <body
    class="bg-[var(--sagescale-sage-blue-900)]"
    style="font-family: Inter, 'Noto Sans', sans-serif"
  >
    <div
      class="relative flex size-full min-h-screen flex-col dark group/design-root overflow-x-hidden"
    >
      <div class="layout-container flex h-full grow flex-col">
        <header
          class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[var(--sagescale-sage-blue-700)] px-10 py-3"
        >
          <div class="flex items-center gap-4 text-white">
            <svg
              class="h-8 w-8 text-white"
              fill="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M12 2L2 7V17L12 22L22 17V7L12 2ZM12 4.4L19.6 9L12 13.6L4.4 9L12 4.4ZM11 10.5V19.2L3.5 15V9.3L11 10.5ZM13 10.5L20.5 9.3V15L13 19.2V10.5Z"
              ></path>
            </svg>
            <h2
              class="text-white text-lg font-bold leading-tight tracking-[-0.015em]"
            >
              SageScale
            </h2>
          </div>
          <div class="flex flex-1 justify-end items-center gap-8">
            <div class="flex items-center gap-9">
              <a class="text-white text-sm font-medium leading-normal" href="#"
                >Work</a
              >
              <a class="text-white text-sm font-medium leading-normal" href="#"
                >About</a
              >
              <a class="text-white text-sm font-medium leading-normal" href="#"
                >Contact</a
              >
            </div>
            <div
              class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
              style="
                background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDW3SFL8ApY8FkX1yCb4h3foQqad4vkJhVkrBSX8hyBkDlFc1eeUcGr7hUtHwO_EJwfj9KbOsx3dQiLYus4Am6RM_1Z4xJ55lwmG3p36QRndNCU27DFEXsN3-zs2973rZHbJEeddwaXGD1gVCtCjfzkLFWNle5EhMDZrzAlKGxU8iL87AjlARP4mJfv__uSrqZ1ZgulUCKdD5vpKWctwFr8U-YnqE2ZYXXIMTn9eysZsudz-aCYF9yYL7K_Yt_Lme-AtMOPJ_vf');
              "
            ></div>
          </div>
        </header>
        <main class="flex-1">
          <div
            class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 sm:py-24"
          >
            <div class="grid grid-cols-1 md:grid-cols-12 gap-12">
              <div
                class="md:col-span-5 flex flex-col justify-center text-center md:text-left"
              >
                <h2
                  class="text-3xl font-bold tracking-tight text-[var(--sagescale-parchment-100)] sm:text-4xl"
                >
                  Contact
                </h2>
                <p class="mt-4 text-lg text-[var(--sagescale-parchment-300)]">
                  I'm always open to discussing new projects, creative ideas, or
                  opportunities. Feel free to reach out.
                </p>
                <div class="mt-8 flex flex-col gap-4">
                  <a
                    class="group inline-flex items-center justify-center md:justify-start gap-3 text-lg text-[var(--sagescale-parchment-100)] hover:text-[var(--sagescale-amber-500)] transition-colors"
                    href="mailto:hello@sagescale.design"
                  >
                    <svg
                      class="lucide lucide-mail h-6 w-6"
                      fill="none"
                      height="24"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      width="24"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <rect height="16" rx="2" width="20" x="2" y="4"></rect>
                      <path
                        d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"
                      ></path>
                    </svg>
                    <span>hello@sagescale.design</span>
                  </a>
                  <div
                    class="flex items-center justify-center md:justify-start space-x-4 mt-4"
                  >
                    <a
                      class="text-[var(--sagescale-parchment-300)] hover:text-white transition-colors"
                      href="#"
                    >
                      <svg
                        class="lucide lucide-linkedin"
                        fill="none"
                        height="28"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        viewBox="0 0 24 24"
                        width="28"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
                        ></path>
                        <rect height="12" width="4" x="2" y="9"></rect>
                        <circle cx="4" cy="4" r="2"></circle>
                      </svg>
                    </a>
                    <a
                      class="text-[var(--sagescale-parchment-300)] hover:text-white transition-colors"
                      href="#"
                    >
                      <svg
                        class="lucide lucide-dribbble"
                        fill="none"
                        height="28"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        viewBox="0 0 24 24"
                        width="28"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <circle cx="12" cy="12" r="10"></circle>
                        <path
                          d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72"
                        ></path>
                        <path
                          d="M2.35 15.4C4.21 18.07 7.26 20 10.79 20c2.42 0 4.65-.96 6.34-2.5"
                        ></path>
                        <path
                          d="M21.65 15.4c-1.3-4.46-3.7-7.44-7.2-9.06"
                        ></path>
                      </svg>
                    </a>
                  </div>
                </div>
              </div>
              <div class="md:col-span-7">
                <form action="#" class="space-y-6" method="POST">
                  <div>
                    <label
                      class="block text-sm font-medium text-[var(--sagescale-parchment-100)]"
                      for="name"
                      >Name</label
                    >
                    <div class="mt-1">
                      <input
                        autocomplete="name"
                        class="block w-full rounded-md border-transparent bg-[var(--sagescale-sage-blue-700)] text-white placeholder-[var(--sagescale-parchment-300)] focus:border-[var(--sagescale-amber-500)] focus:ring-[var(--sagescale-amber-500)] sm:text-sm py-3 px-4"
                        id="name"
                        name="name"
                        placeholder="Your Name"
                        type="text"
                      />
                    </div>
                  </div>
                  <div>
                    <label
                      class="block text-sm font-medium text-[var(--sagescale-parchment-100)]"
                      for="email"
                      >Email</label
                    >
                    <div class="mt-1">
                      <input
                        autocomplete="email"
                        class="block w-full rounded-md border-transparent bg-[var(--sagescale-sage-blue-700)] text-white placeholder-[var(--sagescale-parchment-300)] focus:border-[var(--sagescale-amber-500)] focus:ring-[var(--sagescale-amber-500)] sm:text-sm py-3 px-4"
                        id="email"
                        name="email"
                        placeholder="Your Email"
                        type="email"
                      />
                    </div>
                  </div>
                  <div>
                    <label
                      class="block text-sm font-medium text-[var(--sagescale-parchment-100)]"
                      for="message"
                      >Message</label
                    >
                    <div class="mt-1">
                      <textarea
                        class="block w-full rounded-md border-transparent bg-[var(--sagescale-sage-blue-700)] text-white placeholder-[var(--sagescale-parchment-300)] focus:border-[var(--sagescale-amber-500)] focus:ring-[var(--sagescale-amber-500)] sm:text-sm py-3 px-4"
                        id="message"
                        name="message"
                        placeholder="Your Message"
                        rows="4"
                      ></textarea>
                    </div>
                  </div>
                  <div>
                    <button
                      class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-[var(--sagescale-sage-blue-950)] bg-[var(--sagescale-amber-500)] hover:bg-yellow-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[var(--sagescale-amber-500)] focus:ring-offset-[var(--sagescale-sage-blue-900)] transition-colors"
                      type="submit"
                    >
                      Send Message
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
